name: Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35 and NDK 27.0.12077973
        run: sdkmanager "platforms;android-35" "ndk;27.0.12077973" >/dev/null

      - name: Build debug APK
        run: ./gradlew assembleNonRoot_gameDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Driftlight-android-debug
          path: app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-debug.apk
          if-no-files-found: error

      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Smoke-test landscape host and settings surfaces
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-debug.apk
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell am start -W -n com.veedy.driftlight.debug/com.limelight.PcView
            sleep 5
            mkdir -p ui-smoke
            adb exec-out screencap -p > ui-smoke/host-library.png
            adb shell input tap 1552 140
            sleep 3
            adb exec-out screencap -p > ui-smoke/settings.png

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Driftlight-ui-smoke
          path: ui-smoke/*.png
          if-no-files-found: warn
